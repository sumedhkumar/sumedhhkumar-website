name: Build Hostinger static output

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[hostinger-static]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare encrypted build environment
        shell: pwsh
        env:
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
        run: |
          if (-not $env:HOSTINGER_ENV_FILE) {
            throw "HOSTINGER_ENV_FILE secret is not configured."
          }
          Set-Content -LiteralPath "$env:RUNNER_TEMP\hostinger.env" -Value $env:HOSTINGER_ENV_FILE -NoNewline

      - run: node scripts/build-hostinger-static.mjs --env-file "$env:RUNNER_TEMP\hostinger.env"

      - name: Sync static output to repository root
        shell: pwsh
        run: |
          $items = @(
            ".htaccess",
            "404.html",
            "__next.__PAGE__.txt",
            "__next._full.txt",
            "__next._head.txt",
            "__next._index.txt",
            "__next._tree.txt",
            "_next",
            "_not-found",
            "404",
            "admin",
            "ai-trading-agents",
            "algo-trading-course",
            "contact",
            "courses",
            "custom-solutions",
            "experts",
            "icon.svg",
            "images",
            "lp",
            "index.html",
            "index.txt",
            "payments",
            "privacy",
            "refund-policy",
            "shipping-delivery",
            "terms"
          )
          foreach ($item in $items) {
            if (Test-Path -LiteralPath $item) {
              Remove-Item -LiteralPath $item -Recurse -Force
            }
          }
          Copy-Item -Path "out\*" -Destination "." -Recurse -Force
          Copy-Item -LiteralPath "out\.htaccess" -Destination ".htaccess" -Force

      - name: Commit static output
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .htaccess 404.html __next.*.txt _next _not-found 404 admin ai-trading-agents algo-trading-course contact courses custom-solutions experts icon.svg images lp index.html index.txt payments privacy refund-policy shipping-delivery terms
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Hostinger static output [hostinger-static]"
            git push
          } else {
            Write-Host "Static output is already up to date."
          }
